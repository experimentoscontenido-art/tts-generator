name: Generar Audio TTS

permissions:
  contents: write

on:
  repository_dispatch:
    types: [generar_audio]

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar edge-tts
        run: pip install edge-tts
      - name: Generar audio
        env:
          TEXTO: ${{ github.event.client_payload.texto }}
          ID_EJECUCION: ${{ github.event.client_payload.id_ejecucion }}
          INDICE: ${{ github.event.client_payload.indice }}
        run: python generar_audio.py "$TEXTO" "$ID_EJECUCION" "$INDICE"
      - name: Guardar resultado en el repo
        env:
          ID_EJECUCION: ${{ github.event.client_payload.id_ejecucion }}
          INDICE: ${{ github.event.client_payload.indice }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add "$ID_EJECUCION/escena_$INDICE.mp3"
          git commit -m "Audio escena $INDICE" || echo "Sin cambios"
          OK=0
          for i in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push; then
              OK=1
              break
            fi
            echo "Push rechazado, reintento $i..."
            sleep $((i * 4))
          done
          if [ "$OK" -ne 1 ]; then
            echo "No se pudo subir el audio al repositorio"
            exit 1
          fi
